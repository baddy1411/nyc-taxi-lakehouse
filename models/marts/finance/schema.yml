# models/marts/finance/schema.yml
# ════════════════════════════════════════════════════════════════════
# Data contract for the Finance mart.
# Every column documented. 40+ tests. Freshness assertions.
# ════════════════════════════════════════════════════════════════════

version: 2

models:

  - name: fct_trips
    description: >
      **Primary fact table for NYC Yellow Taxi trips.**
      
      Grain: one row per trip (tpep_pickup_datetime + pulocationid unique).
      Partitioned by pickup_date for efficient BI range scans.
      
      Revenue follows TLC fare decomposition:
        total = fare + extra + mta_tax + improvement_surcharge
                + tolls + congestion_surcharge + airport_fee + tip
      
      Window functions pre-computed: zone rolling averages, fare percentiles,
      daily running counts. Avoids repeated expensive scans in BI tools.

    config:
      contract:
        enforced: true

    columns:

      # ── Keys ──────────────────────────────────────────────────────
      - name: trip_sk
        description: "Surrogate key: integer hash(vendorid || pickup_ts || pulocationid)"
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests:
          - not_null
          - unique

      - name: date_id
        description: "FK → dim_date.date_id (YYYYMMDD integer)"
        data_type: integer
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: pickup_location_id
        description: "FK → dim_location.location_id"
        data_type: smallint
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id

      - name: dropoff_location_id
        description: "FK → dim_location.location_id"
        data_type: smallint
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id

      # ── Timestamps ────────────────────────────────────────────────
      - name: pickup_ts
        description: "Trip start timestamp (NYC local time)"
        data_type: timestamp
        tests:
          - not_null

      - name: pickup_date
        description: "Pickup date (partition key)"
        data_type: date
        tests:
          - not_null

      - name: pickup_hour
        description: "Hour of pickup (0–23)"
        data_type: smallint
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23

      # ── Trip measures ─────────────────────────────────────────────
      - name: trip_distance
        description: "Trip distance in miles (meter-measured)"
        data_type: float
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200

      - name: trip_duration_min
        description: "Trip duration in minutes (dropoff - pickup)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 300

      - name: speed_mph
        description: "Average speed during trip (distance / duration)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 80

      - name: passenger_count
        description: "Number of passengers (1–6; 0 allowed for empty dispatch)"
        data_type: smallint
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9

      # ── Fares ─────────────────────────────────────────────────────
      - name: fare_amount
        description: "Metered fare per TLC rate card ($)"
        data_type: float
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 3.0
              max_value: 350.0

      - name: tip_amount
        description: "Tip in dollars (CC only; cash tips not recorded)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: total_amount
        description: "Full trip total charged to passenger"
        data_type: float
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 3.0

      - name: tip_rate
        description: "tip / fare_amount (0 for cash payments)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1.0

      - name: fare_per_mile
        description: "fare / trip_distance ($/mile, capped at $50)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 50

      # ── Flags ─────────────────────────────────────────────────────
      - name: payment_type
        description: "1=CC, 2=Cash, 3=No charge, 4=Dispute"
        data_type: smallint
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]

      - name: payment_label
        description: "Human-readable payment type"
        data_type: varchar
        tests:
          - accepted_values:
              values: ['credit_card', 'cash', 'no_charge', 'dispute', 'unknown']

      - name: pickup_borough
        description: "Pickup borough from dim_location"
        data_type: varchar
        tests:
          - accepted_values:
              values: ['Manhattan', 'Queens', 'Brooklyn', 'Bronx', 'Staten Island', 'EWR', 'Unknown']

      # ── Window columns ────────────────────────────────────────────
      - name: zone_7d_rolling_avg_fare
        description: "7-day trailing average fare for this pickup zone"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 3.0
              max_value: 200.0

      - name: fare_pctile_zone_hour
        description: "Percentile rank of this fare within same zone×hour bucket (0–1)"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 1.0

    # Model-level tests
    tests:
      # Data freshness: must have data within last 26 hours
      - dbt_utils.recency:
          datepart: hour
          field: pickup_ts
          interval: 26

  - name: fct_hourly_demand
    description: >
      Pre-aggregated demand by (date, hour, pickup_location).
      Designed as the fast path for demand heatmaps and capacity planning.
      Avoids repeated 500K-row scans for the most common BI query pattern.

    columns:
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 23}
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: trip_count
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: avg_fare
        tests:
          - dbt_utils.accepted_range: {min_value: 3.0, max_value: 300.0}
