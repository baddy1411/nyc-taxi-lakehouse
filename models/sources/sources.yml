# models/sources/sources.yml
# ══════════════════════════════════════════════════════════════
# dbt source declarations for the NYC TLC Lakehouse.
#
# Sources are the raw inputs to the pipeline — we declare them
# here so dbt can:
#   1. Generate documentation (lineage DAG)
#   2. Run source freshness checks (dbt source freshness)
#   3. Express FK relationships in tests
# ══════════════════════════════════════════════════════════════

version: 2

sources:

  - name: nyc_tlc
    description: >
      **NYC Taxi and Limousine Commission (TLC) Trip Record Data.**
      
      Published monthly by the NYC TLC at:
      https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page
      
      Data is partitioned by year/month in the Bronze layer.
      Silver layer applies schema validation and cleaning before this source is used.
    
    database: nyc_lakehouse
    schema: silver

    freshness:
      warn_after:  {count: 25, period: hour}
      error_after: {count: 48, period: hour}

    loaded_at_field: tpep_pickup_datetime

    tables:

      - name: clean_trips
        description: >
          Silver layer: cleaned, validated, enriched Yellow Taxi trips.
          
          Produced by pipeline/silver/clean_trips.py.
          Rate-code-aware IQR outlier removal applied; 1.9% of raw trips quarantined.
          38 derived features added (time buckets, financial ratios, geo flags).
        
        columns:
          - name: vendorid
            description: "1=CMT (Creative Mobile Technologies), 2=VTS (VeriFone)"
          
          - name: tpep_pickup_datetime
            description: "Trip start timestamp. Source of data freshness measurement."
          
          - name: tpep_dropoff_datetime
            description: "Trip end timestamp."
          
          - name: passenger_count
            description: "Self-reported passenger count (nullable; some vendors don't record)"
          
          - name: trip_distance
            description: "Miles travelled per taximeter"
          
          - name: ratecodeid
            description: "1=Standard, 2=JFK, 3=Newark, 4=Nassau, 5=Negotiated, 6=Group"
          
          - name: pulocationid
            description: "TLC pickup zone ID (1–263). FK → dim_location.location_id"
          
          - name: dolocationid
            description: "TLC dropoff zone ID (1–263). FK → dim_location.location_id"
          
          - name: payment_type
            description: "1=CreditCard, 2=Cash, 3=NoCharge, 4=Dispute"
          
          - name: fare_amount
            description: "Metered fare per TLC rate card ($). JFK=$70, Newark=$108+ (flat rate)"
          
          - name: tip_amount
            description: "Electronic tip (CreditCard only; cash tips not recorded by TLC)"
          
          - name: total_amount
            description: "Total charged: fare + surcharges + tolls + tip"

          # ── Derived columns (added by silver transform) ────────────────
          - name: derived_trip_duration_min
            description: "Trip duration in minutes (dropoff - pickup)"
          
          - name: derived_pickup_hour
            description: "Hour of pickup (0–23)"
          
          - name: derived_is_rush_hour
            description: "True if pickup during AM/PM rush (Mon–Fri 07–09 or 16–19)"
          
          - name: derived_is_weekend
            description: "True if pickup on Saturday or Sunday"
          
          - name: derived_tip_rate
            description: "tip / fare (0.0 for cash payments)"
          
          - name: derived_fare_per_mile
            description: "fare / distance ($/mi, capped at $50)"
          
          - name: derived_speed_mph
            description: "Average speed: distance / (duration/60)"
          
          - name: derived_is_airport_trip
            description: "True if pickup or dropoff at JFK, LGA, or EWR"
          
          - name: derived_in_congestion_zone
            description: "True if pickup in Manhattan Congestion Pricing Zone"
