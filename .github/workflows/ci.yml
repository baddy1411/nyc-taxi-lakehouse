name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  repository-health:
    name: Repository Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lightweight tooling
        run: python -m pip install ruff

      - name: Check for undefined names
        run: ruff check . --output-format=github --select=F821,F822,F823

      - name: Compile Python modules
        run: python -m compileall dashboard ingestion monitoring pipeline scripts tests run_pipeline.py

      - name: Verify README assets
        run: |
          test -f README.md
          test -f docs/command-center-preview.svg

  pipeline-smoke:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: repository-health

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install core data dependencies
        run: |
          python -m pip install \
            "duckdb>=0.10,<1" \
            "numpy>=1.26,<2" \
            "pandas>=2.1,<3" \
            "pyarrow>=15,<17" \
            "pydantic>=2.5,<3" \
            "pytest>=7.4,<9" \
            requests

      - name: Generate sample data
        run: python scripts/generate_test_data.py --rows 2000

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run Silver contract smoke check
        run: |
          python run_pipeline.py --stage silver
          python monitoring/contracts/silver_contract.py \
            --path data/lakehouse/silver \
            --fail-on-error
